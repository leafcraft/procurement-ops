# Supplier catalog — available suppliers per SKU.
# In production replace with a supplier management API
# (Coupa, SAP Ariba, Oracle Procurement, etc.).
#
# Fields per supplier entry:
#   name              Supplier company name
#   unit_price        Price per unit (USD)
#   lead_time_days    Delivery lead time from order placement
#   reliability       Historical composite score (0.0 – 1.0)
#                     Combines on-time delivery rate + quality acceptance rate
#   moq               Minimum order quantity
#   contact_email     Primary procurement contact
#   payment_terms     NET30 / NET45 / NET60 / COD / PREPAY
#   currency          Invoice currency (USD / EUR / CNY / INR)
#   region            Supplier geographic region (domestic / europe / asia / latam)
#   certifications    Quality or compliance certifications held
#
# Special keys:
#   default       Fallback when no catalog entry exists for a SKU
#   performance   Aggregate KPIs refreshed from ERP/SRM on a schedule

